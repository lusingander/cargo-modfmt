[package]
name = "cargo-modfmt"
version = "0.1.0"
description = "Cargo subcommand that sorts and groups Rust mod and use declarations"
authors = ["Kyosuke Fujimoto <kyoro.f@gmail.com>"]
homepage = "https://github.com/lusingander/cargo-modfmt"
repository = "https://github.com/lusingander/cargo-modfmt"
readme = "README.md"
license = "MIT"
keywords = ["cargo", "subcommand", "plugin"]
categories = ["development-tools::cargo-plugins", "command-line-utilities"]
edition = "2024"
rust-version = "1.98.0"

exclude = ["/.github", "/docs"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.33"
ra_ap_syntax = "0.0.359"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
unicode-width = "0.2.2"

[dev-dependencies]
assert_cmd = "2.2.2"
rstest = { version = "0.28.0", default-features = false }
